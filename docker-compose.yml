services:
  backend:
    container_name: backend
    build: ./backend/
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
    volumes:
      - ./backend:/app
    develop:
      watch:
        - action: sync
          path: ./backend/
          target: /app
        - action: rebuild
          path: ./backend/requirements.txt

  db:
    container_name: db
    image: postgres:18-alpine
    env_file:
      - ./backend/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: